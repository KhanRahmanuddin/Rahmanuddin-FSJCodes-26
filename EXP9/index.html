<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Background</title>
</head>
<body style="text-align: center; background-color: aqua;">
    <h1>Welcome To RCOE</h1>
    <h2>Hello, Rahmanuddin</h2>

    <script>
        function changeBg() {
            let colors = ["#1chd4a", "#1a2dfa", "#1aa2ba", "#8b37fa", "#f25df5", "#f28d35"]
            const bodyEle = document.querySelector("body");
            let randomIndex = Math.floor(Math.random() * 6);
            bodyEle.style.backgroundColor = colors[randomIndex];
        }
        setInterval(() => {
            changeBg();
        }, 500);
    </script>
</body>
</html>
