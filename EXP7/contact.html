<main>
<section class="page-head">
  <div class="wrap">
    <div class="eyebrow">Contact</div>
    <h1>Let's work together</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="wrap contact-grid">
    <div class="contact-info">
      <p>Have a project in mind, a question, or just want to say hi? Feel free to reach out.</p>
      <div class="social-list">
        <a href="mailto:khanrahmanuddin@eng.rizvi.edu.in">khanrahmanuddin@eng.rizvi.edu.in</a>
        <a href="https://github.com/KhanRahmanuddin" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
    <form id="contactForm">
      <div class="field"><label for="name">Name</label><input id="name" type="text" placeholder="Your name" required></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="msg">Message</label><textarea id="msg" placeholder="Tell me about your project" required></textarea></div>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
  </div>
</section>
